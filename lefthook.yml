# Pre commit: lint, format, and typecheck on staged work.
# Docs: https://lefthook.dev/configuration/
pre-commit:
  jobs:
    - name: biome
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: "*.{ts,tsx,json}"
      run: pnpm typecheck
